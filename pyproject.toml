[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drillholedb"
version = "1.0.0"
description = "A Python library for geological drillhole data management and analysis"
readme = "README.md"
authors = [
    {name = "DrillholeDB Contributors"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
keywords = ["geology", "drillhole", "mining", "geoscience", "survey", "desurveying"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
viz = [
    "pyvista>=0.38.0",
]
progress = [
    "tqdm>=4.60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
all = [
    "drillholedb[viz,progress,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/drillholedb"
Documentation = "https://github.com/yourusername/drillholedb#readme"
Repository = "https://github.com/yourusername/drillholedb"
"Bug Tracker" = "https://github.com/yourusername/drillholedb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["drillholedb*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
